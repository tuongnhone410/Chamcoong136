name: Build Android APK Clean

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Inject API Key
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > app/.env

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle Properties for KSP
        run: |
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true" >> gradle.properties

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # 1. Giải mã Keystore cố định từ GitHub Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/my-release-key.jks

      # 2. Build APK và ký bằng Keystore cố định
      - name: Build Signed APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Didea.active=false"
        run: |
          ./gradlew clean assembleDebug \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon --no-configuration-cache

      # 3. Xuất file APK hoàn chỉnh
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeSnapPro-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
