name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Hạ xuống bản 8.7 chuẩn Android để không bị xung đột hệ thống
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    # Bơm API Key vào file .env
    - name: Inject API Key
      run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

    # Ép chế độ headless né lỗi đồ họa cũ và tắt config cache
    - name: Build Debug APK
      env:
        GRADLE_OPTS: -Djava.awt.headless=true
      run: gradle assembleDebug --no-configuration-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeSnapPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk