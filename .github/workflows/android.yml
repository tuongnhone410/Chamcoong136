name: Build Android APK From Scratch

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Cài đặt Gradle 8.7 sạch lên máy ảo
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    # 2. Bơm API Key vào file cấu hình môi trường
    - name: Inject API Key
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > app/.env

    # 3. Tự sinh file gradlew chuẩn từ Gradle 8.7 vừa cài
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # 4. Cấp quyền chạy cho file vừa sinh ra
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Tiến hành Build APK (Né lỗi đồ họa KSP)
    - name: Build Debug APK
      env:
        GRADLE_OPTS: -Djava.awt.headless=true
      run: ./gradlew assembleDebug --no-configuration-cache

    # 6. Xuất file APK ra ngoài để tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeSnapPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
