name: Build Android APK Clean

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Nâng cấp lên Gradle 9.3.1 theo đúng yêu cầu của dự án
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    # 2. Bơm API Key vào file môi trường
    - name: Inject API Key
      run: |
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > app/.env

    # 3. Tạo Wrapper chuẩn bản 9.3.1
    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    # 4. Cấp quyền chạy file gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Tiến hành Build APK (Vừa đúng bản Gradle, vừa né được lỗi giao diện KSP)
    - name: Build Debug APK
      env:
        GRADLE_OPTS: -Djava.awt.headless=true
      run: ./gradlew assembleDebug --no-configuration-cache

    # 6. Xuất file APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeSnapPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
